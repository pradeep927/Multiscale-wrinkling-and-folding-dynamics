# =============================================================================
# Active-gel bilayer shell model of an epithelial dome
# (continuum active gel shell, Supplementary Note 1 of Chahare, Ouzeri,
#  Wilson, Bal et al., "Multiscale wrinkling and folding dynamics in
#  epithelial shells")
#
# Protocol: flat disc clamped at its edge -> inflation (vnstep steps) -> hold
# (gap steps: cortices relax, turnover) -> deflation (v_rn_step steps, smaller
# time step) -> relaxation. Late in the deflation a spring anchors the parts of
# the shell that touch the substrate.
# =============================================================================

# ---- mesh -------------------------------------------------------------------
# disc of radius 0.25 in the mesh file, rescaled to radius R in the code
prefixMesh  =circ34_25_100
R=0.5;               # footprint radius
height_in=0.0385;    # initial thickness h0 (R/h0 = slenderness)
subdiv=0.0;          # 1: subdivision-surface basis, 0: linear triangles
mesh_refine=0.0;     # 1: one level of uniform h-refinement
sp_gap=0.005;        # nodes with r > R - sp_gap are clamped
choice=11;           # 10: clamp all DOFs of those nodes (x, h, LAM); otherwise only x

# ---- nonlinear solver (Newton-Raphson, no line search, + MUMPS) -----------------
RESTOL_NR  = 5.E-7   # residual tolerance
SOLTOL_NR  = 5.E-7   # solution tolerance
MAXITER_NR = 15      # maximum Newton iterations per step
gPts  = 3            # Gauss points per triangle
ConsCheck=0;         # 1: check the Jacobian of LS by finite differences

# ---- time stepping ------------------------------------------------------------
deltat     = 0.00001; # initial time step
deltatMax  =0.02     # maximum time step (inflation, hold, final relaxation)
tSimu      = 0.0
totalTime  = 1000000
totalSteps =50
stepFactor =0.99     # dt -> dt*stepFactor on failure, dt/stepFactor on success
nPrint=5;            # write sol_dis.<step>.vtk and a line of globalIntegrals.dat every nPrint steps
forward_new=0.0;     # relaxation of the material metrics: 0 implicit (local Newton), 1 explicit

# ---- protocol: inflation -> hold -> deflation -----------------------------------
v_target=0.7;        # inflated volume / (R * footprint area); 0.667 = hemisphere
vnstep=2000;         # inflation steps (volume ramped linearly 0 -> target)
gap=4000;            # hold steps
v_rn_step=4000;      # deflation steps (volume ramped linearly target -> 0)
v_cont=0.96;         # fraction of the deflation that is applied (then hold)
coeff=0.0;           # optional exponential factor exp(coeff*dt*step) on the deflation ramp (0 = linear)
control_steps=400;   # start reducing dt this many steps before the deflation
control_dt=0.00003;  # maximum dt during the deflation (deflation time ~ v_rn_step*control_dt)
time_target=1;       # material metrics kept at the reference for timestep < time_target
factor=1.0;          # initial value of the volume target (overwritten from the first step)

# ---- cortex (active gel) -----------------------------------------------------------
# neo-Hookean cortex, mu = lambda = young/(2(1+poisson))
young=25.0;
poisson=0.25;
fric2=2;             # cortex viscosity eta (relaxation time ~ 2 fric2 (1+nu)/young)
fact_elastic=0.00000; # weight of a non-relaxing elastic energy (only reported as Ela_small)
# active tensions: apical = gamma_l*gamma_sigma*(1-tens_factor)/2,
#                  basal  = gamma_l*gamma_sigma*(1+tens_factor)/2,
#                  lateral = gamma_l * f0/3 per direction, f0 = 2*gamma_sigma*f0_factor
gamma_l=5.0;
gamma_sigma=2.0;
tens_factor=0.0;     # apical-basal asymmetry (0 = symmetric)
f0_factor=0.19;      # lateral tension ratio f-bar
aap=1.0;             # apical surface at +aap*h/2
bbn=1.0;             # basal surface at -bbn*h/2
# turnover: d rho/dt = k_p - k_d rho - rho tr(d)   (steady state k_p/k_d, turnover time 1/k_d)
k_p=10.0;
k_d=10.0;

# ---- environment ---------------------------------------------------------------------
fric=0.4;            # drag of the medium
Kconf=5.0E+8;        # keep the shell above the substrate z = 0
# late anchoring to the substrate: from step vnstep+gap+control_fric, points with
# z < 1.05 height_in (tanh transition of width 1/width) are tied by a spring kspr
# to their position at that step
kspr=1.0E+5;
width=90.0;
control_fric=3840.0; # set very large to switch off
