# =============================================================================
# Phenomenological viscoelastic shell model of an epithelial dome
# (Model C, Supplementary Note 6 of Chahare, Ouzeri, Wilson, Bal et al.,
#  "Multiscale wrinkling and folding dynamics in epithelial shells")
#
# Protocol: flat disc clamped at its edge -> inflation (vnstep steps) -> hold
# (gap steps, the material metric G and curvature kbar relax) -> deflation
# (v_rn_step steps, with a smaller time step) -> relaxation.
# Units: lengths in units of the mesh (footprint radius R); moduli and tension
# in tension units; the active pre-tension gamma sets the stress scale.
# =============================================================================

# ---- mesh -------------------------------------------------------------------
# disc of radius 0.34 in the mesh file, rescaled to radius R in the code
prefixMesh  =circ34_25_normal
mesh_refine=0.0;     # 1: one level of uniform h-refinement of the mesh
R=0.5;               # footprint radius
choice=10;           # 10: circular footprint, base area = 3.141 R^2 (else: measured mesh area)

# ---- nonlinear solver (Newton-Raphson + MUMPS) --------------------------------
RESTOL_NR  = 5.E-7   # residual tolerance
SOLTOL_NR  = 5.E-7   # solution tolerance
MAXITER_NR = 15      # maximum Newton iterations per step
gPts  = 3            # Gauss points per triangle
ConsCheck=0;         # 1: check the Jacobian of LS by finite differences

# ---- time stepping ------------------------------------------------------------
deltat     = 0.0001; # initial time step
deltatMax  =0.03;    # maximum time step (inflation, hold, final relaxation)
tSimu      = 0.0     # initial time
totalTime  = 1000000
totalSteps =11974
stepFactor =0.99     # dt -> dt*stepFactor on failure, dt/stepFactor on success
nPrint=5;            # write sol_dis.<step>.vtk and a line of globalIntegrals.dat every nPrint steps
forward_new=0.0;     # relaxation of G, kbar: 0 implicit (local Newton), 1 explicit Euler

# ---- protocol: inflation -> hold -> deflation -----------------------------------
v_target=0.667;      # inflated volume / (R * footprint area); 0.667 = hemisphere
vnstep=3000;         # inflation steps (volume ramped linearly 0 -> target)
gap=5000;            # hold steps at the inflated volume
v_rn_step=4000;      # deflation steps (volume ramped linearly target -> 0)
v_cont=0.9999;       # fraction of the deflation that is applied (then hold at the final volume)
control_steps=400;   # start reducing dt this many steps before the deflation
control_dt=0.00009;  # maximum dt during deflation (sets the deflation time ~ v_rn_step*control_dt)
time_target=1;       # G and kbar are kept at the flat reference for timestep < time_target

# ---- shell mechanics ------------------------------------------------------------
# relaxing (passive) membrane neo-Hookean, Eq. (55)        mu/lambda = 0.47
mu=7.8372;
lambda=16.6482;
# active pre-tension sigma_a (constant surface tension), Eq. (53)
gamma=8.125;
# strain dependence of the pre-tension: non-relaxing neo-Hookean, Eq. (54)
# (mu_pre/lambda_pre = 1.3), multiplied by fact_elastic
mu_pre=1.5797;
lambda_pre=1.2147;
fact_elastic=1.0;
# bending: h^2/4 C (k - kbar)(k - kbar), thickness h = height_in / J (thins with stretch)
height_in=0.018;     # thickness (R/h = slenderness)
# viscosities of the relaxation, Eqs. (58)-(59)
fric2=35.0;          # in-plane viscosity eta_c (relaxation time ~ fric2/mu)
fric3=0.1;           # bending viscosity eta'_c
# viscous drag of the surrounding medium on the shell velocity
fric=0.8;
# keep the shell above the substrate z = 0 (one-sided cubic penalty)
Kconf=1.0E+8;

# ---- optional: larger drag near the substrate late in the deflation ---------------
# from step vnstep+gap+control_fric:
#   fric -> fric*fric_fact + fric*(fric_fact-1)*tanh(width*(thick - z))
control_fric=2700.0; # set very large to switch off
fric_fact=50.0;
width=200.0;
thick=0.0;           # height of the transition (z)
