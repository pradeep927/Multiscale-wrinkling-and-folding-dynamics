# =============================================================================
# Active-gel bilayer shell model of an epithelial dome
# (continuum active-gel shell: apical / basal / lateral cortices, JMPS model)
#
# Protocol: flat disc clamped at its edge -> inflation (vnstep steps) -> hold
# (gap steps: cortices relax, turnover) -> deflation (v_rn_step steps, smaller
# time step) -> relaxation. Late in the deflation a spring anchors the parts of
# the shell that touch the substrate.
# Values are those of the input file as given; only comments and grouping changed.
# =============================================================================

# ---- mesh / geometry ---------------------------------------------------------
prefixMesh  =circ34_25_100
R=0.5;               # footprint radius (mesh disc of radius 0.25 is rescaled to R)
height_in=0.0385;    # initial thickness h0
subdiv=0.0;          # 1: subdivision-surface basis, 0: linear triangles
mesh_refine=0.0;     # 1: one level of uniform h-refinement
sp_gap=0.005;        # nodes with r > R - sp_gap are clamped
choice=11;           # 10: clamp all DOFs of the rim nodes (x, h, LAM); otherwise only x

# ---- nonlinear solver (Newton-Raphson, no line search, MUMPS) ----------------
RESTOL_NR  = 5.E-7   # residual tolerance
SOLTOL_NR  = 5.E-7   # solution (update) tolerance
MAXITER_NR = 15      # maximum Newton iterations per step
gPts  = 3            # Gauss points per triangle
ConsCheck=0;         # 1: finite-difference check of the Jacobian of LS

# ---- efficiency switches (1 = default; 0 = original path, for validation) ----
reuse_energy_factorization=1;  # output projection: constant mass matrix factorised once and reused
assembly_diagnostics_only=1;   # post-convergence refreshes compute only values (integrals, Gauss-point state)

# ---- time stepping -----------------------------------------------------------
deltat     = 0.00001; # initial time step
deltatMax  =0.02      # maximum time step (inflation, hold, final relaxation)
tSimu      = 0.0      # initial time
totalTime  = 1000000  # stop time (in practice totalSteps stops the run)
totalSteps =50        # number of steps (full protocol: vnstep + gap + v_rn_step + relaxation)
stepFactor =0.99      # dt -> dt*stepFactor after a failed step, dt/stepFactor after a converged one
nPrint=5;             # write sol_dis.<step>.vtk and a line of globalIntegrals.dat every nPrint steps
forward_new=0.0;      # relaxation of the material metrics: 0 implicit (local Newton), 1 explicit

# ---- protocol: inflation -> hold -> deflation --------------------------------
v_target=0.7;        # target volume / (R x footprint area) (0.667 = hemisphere)
vnstep=2000;         # inflation steps (volume ramped linearly 0 -> v_target)
gap=4000;            # hold steps at the inflated volume
v_rn_step=4000;      # deflation steps (volume ramped linearly v_target -> 0)
v_cont=0.96;         # fraction of the deflation applied (afterwards the volume is held)
control_steps=400;   # start reducing dt this many steps before the deflation
control_dt=0.00003;  # maximum dt during the deflation (deflation time ~ v_rn_step x control_dt)
factor=1.0;          # initial volume target (overwritten from the first step)
# not set here (code defaults): coeff = 0 (linear deflation ramp), time_target = 1

# ---- cortex (active gel) ------------------------------------------------------
# neo-Hookean cortex with Lame constants from young, poisson; viscous relaxation of the material metrics
young=25.0;          # cortex stiffness
poisson=0.25;        # Poisson ratio
fric2=2;             # cortex viscosity (relaxation time ~ 2 fric2 (1+poisson)/young)
fact_elastic=0.00000; # weight of a non-relaxing elastic energy (reported as Ela_small only)
# active tensions: apical  = gamma_l gamma_sigma (1 - tens_factor)/2
#                  basal   = gamma_l gamma_sigma (1 + tens_factor)/2
#                  lateral = gamma_l f0/3 per direction, f0 = 2 gamma_sigma f0_factor
gamma_l=5.0;         # tension scale
gamma_sigma=2.0;     # apical + basal tension / gamma_l
tens_factor=0.0;     # apical-basal asymmetry (0: symmetric)
f0_factor=0.19;      # lateral tension ratio (f-bar)
aap=1.0;             # apical surface at +aap h/2 (0, 1, 2)
bbn=1.0;             # basal surface at -bbn h/2 (0, 1, 2)
# cortex turnover: d rho/dt = k_p - k_d rho - rho tr(d)   (steady state k_p/k_d, turnover time 1/k_d)
k_p=10.0;            # assembly rate
k_d=10.0;            # disassembly rate

# ---- environment --------------------------------------------------------------
fric=0.4;            # drag of the surrounding medium
Kconf=5.0E+8;        # confinement: keeps the shell above the substrate z = 0
# late anchoring: from step vnstep + gap + control_fric, points with z < 1.05 height_in
# (tanh transition of width 1/width) are tied by a spring kspr to their position at that step
kspr=1.0E+5;         # anchoring spring stiffness
width=90.0;          # sharpness of the anchoring transition
control_fric=3840.0; # anchoring start, steps after the hold (very large: off)

# ---- not read by this code (kept from older versions; changing them has no effect) ----
restart=0;
solver     = MUMPS
SOLTOL_AZ  = 5.E-7
MAXITER_AZ = 5000
mu=10;
force=0.0;
gamma=5.0;
kappa=0.0000005;
kap1=0.0;
a11=0.5;
a12=0.5;
a33=0.98;
mass_balance=0.0;
my_work=0.0;
case_tension=1.0;
square=0;
f0=0.75;             # lateral weight is computed from f0_factor (see above)
vstep=0;
v_r_step=0;
aSteps=1;
tens_start=-10000;
fric_fact=50.0;
spring=0;
out_choice=0.0;
hl_print=500;
out_fact=1.34;
